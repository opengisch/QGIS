---
name: 🪟 Windows Qt6
on:
  push:
    branches:
      - master
      - blacksmith
      - release-**
  pull_request:
  release:
    types: ['published']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  packages: write

jobs:
  build:
    name: build (windows)
    runs-on: blacksmith-8vcpu-windows-2025

    steps:
      - name: 🐣 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: 🔨 Uninstall system cmake
        shell: bash
        run: |
          choco uninstall cmake.install

      - name: 🐩 Install CMake and Ninja
        uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb
        with:
          cmakeVersion: 3.31.6

      - name: 🧽 Developer Command Prompt for Microsoft Visual C++
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 #v1

      - name: 🎡 Setup vcpkg
        uses: ./.github/actions/setup-vcpkg

      - name: 🦬 Setup flex/bison
        uses: robinraju/release-downloader@28fc21f50d76778e7023361aa1f863e717d3d56f #v1.13
        with:
          repository: 'lexxmark/winflexbison'
          fileName: '*.zip'
          tag: 'v2.5.24'
          extract: true

      - name: 🛍️ Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          max-size: 1G
          key: build-ccache-win64-qt6-${{ github.event.pull_request.base.ref || github.ref_name }}
          save: ${{ github.event_name == 'push' }}
          append-timestamp: false

      - name: 🛍️ Tune ccache configuration
        shell: bash
        run: |
          # To make ccache work properly with precompiled headers
          ccache --set-config sloppiness=pch_defines,time_macros,include_file_mtime,include_file_ctime

#      - name: Restore cache
#        uses: actions/cache@v5
#        with:
#          path: |
#            ${{ github.workspace }}/.ccache
#          key: build-ccache-win64-qt6-${{ github.event.pull_request.base.ref || github.ref_name }}        

      - name: 🌱 Install dependencies and generate project files
        id: cmake-configure
        shell: bash
        env:
          X_VCPKG_ASSET_SOURCES: x-azurl,https://assetcache.open-vcpkg.org/assetcache,,read
        run: |
          CCDIR="$(ccache -k cache_dir)"
          printf 'cache_dir=<%s>\n' "$CCDIR"
          du -hs "$CCDIR"
          BUILD_DIR=$( cygpath "${{ github.workspace }}/build" )
          SOURCE_DIR=$( cygpath "${{ github.workspace }}" )

          cmake -S "${SOURCE_DIR}" \
                -B "${BUILD_DIR}" \
                -G Ninja \
                -D CMAKE_BUILD_TYPE=Release \
                -D WITH_VCPKG=ON \
                -D CREATE_ZIP=ON \
                -D VCPKG_TARGET_TRIPLET=x64-windows-release \
                -D VCPKG_HOST_TRIPLET=x64-windows-release \
                -D WITH_DESKTOP=ON \
                -D WITH_3D=ON \
                -D WITH_BINDINGS=ON \
                -D WITH_GEOGRAPHICLIB=OFF \
                -D WITH_SFCGAL=ON \
                -D ENABLE_TESTS=OFF \
                -D USE_CCACHE=ON \
                -D ENABLE_UNITY_BUILDS=OFF \
                -D FLEX_EXECUTABLE="${SOURCE_DIR}/win_flex.exe" \
                -D BISON_EXECUTABLE="${SOURCE_DIR}/win_bison.exe" \
                -D USE_CCACHE=ON \
                -D WITH_QTWEBENGINE=OFF \
                -D VCPKG_INSTALL_OPTIONS="--x-buildtrees-root=C:/src" \
                -D "NUGET_USERNAME=${GITHUB_ACTOR}" \
                -D "NUGET_SOURCE=https://nuget.pkg.github.com/opengisch/index.json" \
                -D NUGET_TOKEN=${{ secrets.GITHUB_TOKEN }}

      - name: Reproduce qgsconfig.h include tracing
        shell: pwsh
        working-directory: C:\runner\_work\QGIS\QGIS\build
        run: |
          $ErrorActionPreference = 'Stop'
      
          $logDir = "C:\runner\_work\QGIS\QGIS\build\ccache-debug"
          New-Item -ItemType Directory -Force -Path $logDir | Out-Null
      
          $cl = "C:\PROGRA~2\MICROS~1\2022\BUILDT~1\VC\Tools\MSVC\1444~1.352\bin\Hostx64\x64\cl.exe"
      
          & $cl `
            /nologo /TP `
            -DABSL_CONSUME_DLL `
            -DCMAKE_SOURCE_DIR=\"C:/runner/_work/QGIS/QGIS\" `
            -DMESHOPTIMIZER_ALLOC_EXPORT `
            '-DMESHOPTIMIZER_API=__declspec(dllimport)' `
            -DNOMINMAX `
            -DPDAL_DLL_EXPORT=1 `
            -DPROTOBUF_USE_DLLS `
            -DQT_CONCURRENT_LIB `
            -DQT_CORE5COMPAT_LIB `
            -DQT_CORE_LIB `
            -DQT_GUI_LIB `
            -DQT_MULTIMEDIA_LIB `
            -DQT_NETWORK_LIB `
            -DQT_NO_CAST_TO_ASCII `
            -DQT_NO_DEBUG `
            -DQT_NO_DEPRECATED_WARNINGS `
            -DQT_NO_FOREACH `
            -DQT_POSITIONING_LIB `
            -DQT_PRINTSUPPORT_LIB `
            -DQT_SERIALPORT_LIB `
            -DQT_SQL_LIB `
            -DQT_SVG_LIB `
            -DQT_USE_QSTRINGBUILDER `
            -DQT_WIDGETS_LIB `
            -DQT_XML_LIB `
            -DSIP_VERSION=0x060f03 `
            -DTEST_DATA_DIR=\"C:/runner/_work/QGIS/QGIS/tests/testdata\" `
            -DUNICODE `
            -DWIN32 `
            -DWIN32_LEAN_AND_MEAN `
            -DWIN64 `
            -DWITH_COPC `
            -DWITH_EPT `
            -DWITH_SFCGAL `
            -D_CRT_NONSTDC_NO_WARNINGS `
            -D_CRT_SECURE_NO_WARNINGS `
            -D_ENABLE_EXTENDED_ALIGNED_STORAGE `
            -D_HAS_AUTO_PTR_ETC=1 `
            -D_HAVE_WINDOWS_H_ `
            -D_UNICODE `
            -D_USE_MATH_DEFINES `
            -D_WIN64 `
            -Dqgis_core_EXPORTS `
            -IC:\runner\_work\QGIS\QGIS\build `
            -IC:\runner\_work\QGIS\QGIS\src\core\providers\ept `
            -IC:\runner\_work\QGIS\QGIS\src\core\providers\copc `
            -IC:\runner\_work\QGIS\QGIS\src\core\providers\vpc `
            -IC:\runner\_work\QGIS\QGIS\build\src\core `
            -IC:\runner\_work\QGIS\QGIS\src\core `
            -IC:\runner\_work\QGIS\QGIS\src\core\3d `
            -IC:\runner\_work\QGIS\QGIS\src\core\3d\materials `
            -IC:\runner\_work\QGIS\QGIS\src\core\actions `
            -IC:\runner\_work\QGIS\QGIS\src\core\annotations `
            -IC:\runner\_work\QGIS\QGIS\src\core\auth `
            -IC:\runner\_work\QGIS\QGIS\src\core\browser `
            -IC:\runner\_work\QGIS\QGIS\src\core\callouts `
            -IC:\runner\_work\QGIS\QGIS\src\core\classification `
            -IC:\runner\_work\QGIS\QGIS\src\core\diagram `
            -IC:\runner\_work\QGIS\QGIS\src\core\dxf `
            -IC:\runner\_work\QGIS\QGIS\src\core\editform `
            -IC:\runner\_work\QGIS\QGIS\src\core\effects `
            -IC:\runner\_work\QGIS\QGIS\src\core\elevation `
            -IC:\runner\_work\QGIS\QGIS\src\core\expression `
            -IC:\runner\_work\QGIS\QGIS\src\core\externalstorage `
            -IC:\runner\_work\QGIS\QGIS\src\core\fieldformatter `
            -IC:\runner\_work\QGIS\QGIS\src\core\geometry `
            -IC:\runner\_work\QGIS\QGIS\src\core\geocoding `
            -IC:\runner\_work\QGIS\QGIS\src\core\gps `
            -IC:\runner\_work\QGIS\QGIS\src\core\labeling `
            -IC:\runner\_work\QGIS\QGIS\src\core\labeling\rules `
            -IC:\runner\_work\QGIS\QGIS\src\core\layertree `
            -IC:\runner\_work\QGIS\QGIS\src\core\layout `
            -IC:\runner\_work\QGIS\QGIS\src\core\locator `
            -IC:\runner\_work\QGIS\QGIS\src\core\maprenderer `
            -IC:\runner\_work\QGIS\QGIS\src\core\mesh `
            -IC:\runner\_work\QGIS\QGIS\src\core\metadata `
            -IC:\runner\_work\QGIS\QGIS\src\core\multimedia `
            -IC:\runner\_work\QGIS\QGIS\src\core\network `
            -IC:\runner\_work\QGIS\QGIS\src\core\numericformats `
            -IC:\runner\_work\QGIS\QGIS\src\core\painting `
            -IC:\runner\_work\QGIS\QGIS\src\core\pal `
            -IC:\runner\_work\QGIS\QGIS\src\core\pdf `
            -IC:\runner\_work\QGIS\QGIS\src\core\plot `
            -IC:\runner\_work\QGIS\QGIS\src\core\pointcloud `
            -IC:\runner\_work\QGIS\QGIS\src\core\pointcloud\expression `
            -IC:\runner\_work\QGIS\QGIS\src\core\processing `
            -IC:\runner\_work\QGIS\QGIS\src\core\processing\models `
            -IC:\runner\_work\QGIS\QGIS\src\core\proj `
            -IC:\runner\_work\QGIS\QGIS\src\core\project `
            -IC:\runner\_work\QGIS\QGIS\src\core\providers `
            -IC:\runner\_work\QGIS\QGIS\src\core\providers\arcgis `
            -IC:\runner\_work\QGIS\QGIS\src\core\providers\memory `
            -IC:\runner\_work\QGIS\QGIS\src\core\providers\gdal `
            -IC:\runner\_work\QGIS\QGIS\src\core\providers\ogr `
            -IC:\runner\_work\QGIS\QGIS\src\core\providers\meshmemory `
            -IC:\runner\_work\QGIS\QGIS\src\core\providers\sensorthings `
            -IC:\runner\_work\QGIS\QGIS\src\core\raster `
            -IC:\runner\_work\QGIS\QGIS\src\core\renderer `
            -IC:\runner\_work\QGIS\QGIS\src\core\scalebar `
            -IC:\runner\_work\QGIS\QGIS\src\core\settings `
            -IC:\runner\_work\QGIS\QGIS\src\core\sensor `
            -IC:\runner\_work\QGIS\QGIS\src\core\stac `
            -IC:\runner\_work\QGIS\QGIS\src\core\symbology `
            -IC:\runner\_work\QGIS\QGIS\src\core\symbology\converters `
            -IC:\runner\_work\QGIS\QGIS\src\core\textrenderer `
            -IC:\runner\_work\QGIS\QGIS\src\core\tiledscene `
            -IC:\runner\_work\QGIS\QGIS\src\core\validity `
            -IC:\runner\_work\QGIS\QGIS\src\core\vector `
            -IC:\runner\_work\QGIS\QGIS\src\core\vectortile `
            -IC:\runner\_work\QGIS\QGIS\src\core\web `
            -IC:\runner\_work\QGIS\QGIS\external\delaunator-cpp `
            -IC:\runner\_work\QGIS\QGIS\external\kdbush\include `
            -IC:\runner\_work\QGIS\QGIS\external\nanoarrow\include `
            -IC:\runner\_work\QGIS\QGIS\external\nmea `
            -IC:\runner\_work\QGIS\QGIS\external\rtree\include `
            -IC:\runner\_work\QGIS\QGIS\external\tinygltf `
            -IC:\runner\_work\QGIS\QGIS\external\freespa `
            -IC:\runner\_work\QGIS\QGIS\external\earcut `
            -external:IC:\runner\_work\QGIS\QGIS\build\vcpkg_installed\x64-windows-release\include `
            -external:IC:\runner\_work\QGIS\QGIS\external\lazperf `
            -external:IC:\runner\_work\QGIS\QGIS\build\vcpkg_installed\x64-windows-release\include\QtCrypto `
            -external:IC:\runner\_work\QGIS\QGIS\build\src\core\qgis_core_autogen\include `
            -external:IC:\runner\_work\QGIS\QGIS\build\vcpkg_installed\x64-windows-release\include\poly2tri `
            -external:IC:\runner\_work\QGIS\QGIS\build\vcpkg_installed\x64-windows-release\include\Qt6\QtCore `
            -external:IC:\`

      - name: 🌋 Build
        env:
          CCACHE_DEBUG: 1
          CCACHE_LOGFILE: ${{ github.workspace }}/ccache.log
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_NOHASHDIR: "true"
          CCACHE_CPP2: "yes"
        shell: bash
        run: |
          CCACHE_DIR="$(ccache -k cache_dir)"
          du -hs $CCACHE_DIR
          echo "CCACHE_DIR=$CCACHE_DIR"
          ccache --show-config
          ccache --show-stats
          cmake --build "${{ github.workspace }}/build" --config Release --target qgis_core

      - name: 📤 Upload ccache debug
#        if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ccache-debug
          path: ${{ github.workspace }}/ccache.log


#      - uses: m-kuhn/action-tmate@patch-1
#        if: failure()

      - name: 📦 Package
        shell: bash
        run: |
          cmake --build "${{ github.workspace }}/build" --target bundle --config Release

      - name: 📦 Create SDK
#        if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
        run: |
          vcpkg.exe export --zip --output-dir=./sdk --x-install-root=./build/vcpkg_installed --x-manifest-root=vcpkg

      - name: 📤 Upload sdk
#        if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qgis-sdk-x64-windows
          path: |
            sdk/vcpkg-export-*.zip

      - name: 📑 Upload dep build logs
        id: upload-build-logs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1

        if: failure()
        with:
          name: build-logs-x64-windows
          path: |
            C:/src/**/*.log

      - name: 🧮 Report vcpkg build failures
        if: failure() && github.event_name == 'pull_request'
        uses: ./.github/actions/vcpkg_build_failures_report
        with:
          buildtrees-dir: C:/src
          triplet: x64-windows
          pr: ${{ github.event.number }}
          artifact-url: ${{ steps.upload-build-logs.outputs.artifact-url }}
          build-status: ${{ job.status }}
          manifest-install-log: ${{ github.workspace }}/build/vcpkg-manifest-install.log
          commit-sha: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: 📤 Upload bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1

        id: artifact-win64-qt6
        with:
          name: qgis-windows-qt6
          archive: false
          path: |
            build/*-win64.zip


      - name: Schedule download comment
        uses: ./.github/actions/post_sticky_comment
        if: github.event_name == 'pull_request'
        with:
          marker: mingw64-qt6
          body: |
            ### 🪟 Windows Qt6 builds
            Download [Windows Qt6 builds of this PR for testing](${{ steps.artifact-win64-qt6.outputs.artifact-url }}).
            To execute locally, unzip the downloaded zip file and run `bin\qgis-bin.exe` in the extracted directory.
            You might be prompted by Windows Defender click "Run anyway"
            *(Built from commit ${{ github.event.pull_request.head.sha }})*
          pr: ${{ github.event.number }}
