---
name: 🪟 Windows Qt6
on:
  push:
    branches:
      - master
      - blacksmith
      - release-**
  pull_request:
  release:
    types: ['published']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  packages: write

jobs:
  build:
    name: build (windows)
    runs-on: blacksmith-8vcpu-windows-2025

    steps:
      - name: 🐣 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: 🔨 Uninstall system cmake
        shell: bash
        run: |
          choco uninstall cmake.install

      - name: 🐩 Install CMake and Ninja
        uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb
        with:
          cmakeVersion: 3.31.6

      - name: 🧽 Developer Command Prompt for Microsoft Visual C++
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 #v1

      - name: 🪳 Install Visual Studio ATL and Clang components
        if: matrix.platform_arch == 'x64' # blacksmith windows-2025 image
        shell: powershell
        run: |
          $vswhere = "${Env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (!(Test-Path $vswhere)) {
            throw "vswhere.exe not found"
          }
          $installPath = & $vswhere -latest -products * -property installationPath
          if (-not $installPath) {
            throw "Visual Studio install not found via vswhere"
          }
          Write-Host "Modifying VS install at $installPath"

          # vs_installer.exe is the bootstrapper for the already-installed VS, so it knows the
          # right channel and won't reject the modify request the way a freshly-downloaded
          # bootstrapper from aka.ms can. The caveat is that it returns to the caller almost
          # immediately and runs the real install asynchronously in setup.exe, so we cannot rely
          # on its exit code or on Start-Process -Wait. Instead, launch it, wait for the
          # background installer processes to drain, then poll for the installed files on disk.
          $installer = "${Env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
          if (!(Test-Path $installer)) {
            throw "vs_installer.exe not found at $installer"
          }

          # PowerShell's Start-Process -ArgumentList does not quote individual args that contain
          # spaces, so vs_installer.exe parses "C:\Program Files (x86)\..." as just "C:\Program"
          # and silently no-ops. Quote the path ourselves to make the actual command line correct.
          # The Blacksmith Windows 2025 image ships VS Build Tools without ATL or the LLVM/clang
          # toolset; both are required for this build (ATL headers + clang-cl as compiler).
          $args = @(
            'modify',
            '--installPath', "`"$installPath`"",
            '--add', 'Microsoft.VisualStudio.Component.VC.ATL',
            '--add', 'Microsoft.VisualStudio.Component.VC.Llvm.Clang',
            '--add', 'Microsoft.VisualStudio.Component.VC.Llvm.ClangToolset',
            '--add', 'Microsoft.VisualStudio.Component.VC.Redist.14.Latest',
            '--quiet', '--norestart', '--nocache'
          )
          Start-Process -FilePath $installer -ArgumentList $args -NoNewWindow | Out-Null

          # Give the launcher a moment to spawn the background setup processes, then wait for
          # them to exit before we declare the install complete.
          Start-Sleep -Seconds 10
          $installerProcs = @('vs_installer', 'vs_installershell', 'vs_setup_bootstrapper', 'setup')
          $procDeadline = (Get-Date).AddMinutes(20)
          while ((Get-Date) -lt $procDeadline) {
            $running = Get-Process -Name $installerProcs -ErrorAction SilentlyContinue
            if (-not $running) { break }
            Start-Sleep -Seconds 5
          }

          # Poll for atlbase.h and clang-cl.exe: even after the processes exit the on-disk layout can lag.
          $atlRoot = Join-Path $installPath 'VC\Tools\MSVC'
          $llvmRoot = Join-Path $installPath 'VC\Tools\Llvm\x64\bin'
          $deadline = (Get-Date).AddMinutes(5)
          while ((Get-Date) -lt $deadline) {
            $atl = Get-ChildItem $atlRoot -Recurse -Filter atlbase.h -ErrorAction SilentlyContinue | Select-Object -First 1
            $clang = if (Test-Path (Join-Path $llvmRoot 'clang-cl.exe')) { Join-Path $llvmRoot 'clang-cl.exe' } else { $null }
            if ($atl -and $clang) {
              Write-Host "ATL ready at $($atl.FullName)"
              Write-Host "clang-cl ready at $clang"
              # Expose the LLVM bin directory on PATH for subsequent steps so cmake can resolve `clang-cl`.
              Add-Content -Path $env:GITHUB_PATH -Value $llvmRoot
              return
            }
            Start-Sleep -Seconds 5
          }

          # Surface installer logs to make follow-up failures debuggable.
          Get-ChildItem "$env:TEMP" -Filter 'dd_*.log' -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "===== $($_.Name) ====="
            Get-Content $_.FullName -Tail 100 -ErrorAction SilentlyContinue
          }
          throw "ATL header or clang-cl still missing under $installPath after install (atl=$atl, clang=$clang)"

      - name: 🎡 Setup vcpkg
        uses: ./.github/actions/setup-vcpkg

      - name: 🦬 Setup flex/bison
        uses: robinraju/release-downloader@28fc21f50d76778e7023361aa1f863e717d3d56f #v1.13
        with:
          repository: 'lexxmark/winflexbison'
          fileName: '*.zip'
          tag: 'v2.5.24'
          extract: true

      - name: 🛍️ Setup ccache
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 #v1.2
        with:
          max-size: 1G
          key: build-ccache-win64-qt6-${{ github.event.pull_request.base.ref || github.ref_name }}
          save: ${{ github.event_name == 'push' }}

      - name: 🛍️ Tune ccache configuration
        shell: bash
        run: |
          # To make ccache work properly with precompiled headers
          ccache --set-config sloppiness=pch_defines,time_macros,include_file_mtime,include_file_ctime

      - name: 🌱 Install dependencies and generate project files
        id: cmake-configure
        shell: bash
        env:
          X_VCPKG_ASSET_SOURCES: x-azurl,https://assetcache.open-vcpkg.org/assetcache,,read
        run: |
          BUILD_DIR=$( cygpath "${{ github.workspace }}/build" )
          SOURCE_DIR=$( cygpath "${{ github.workspace }}" )

          cmake -S "${SOURCE_DIR}" \
                -B "${BUILD_DIR}" \
                -G Ninja \
                -D CMAKE_BUILD_TYPE=Release \
                -D CMAKE_C_COMPILER=clang-cl \
                -D CMAKE_CXX_COMPILER=clang-cl \
                -D WITH_VCPKG=ON \
                -D CREATE_ZIP=ON \
                -D VCPKG_TARGET_TRIPLET=x64-windows-release \
                -D VCPKG_HOST_TRIPLET=x64-windows-release \
                -D WITH_DESKTOP=ON \
                -D WITH_3D=ON \
                -D WITH_BINDINGS=ON \
                -D WITH_GEOGRAPHICLIB=OFF \
                -D WITH_SFCGAL=ON \
                -D ENABLE_TESTS=OFF \
                -D USE_CCACHE=ON \
                -D ENABLE_UNITY_BUILDS=OFF \
                -D FLEX_EXECUTABLE="${SOURCE_DIR}/win_flex.exe" \
                -D BISON_EXECUTABLE="${SOURCE_DIR}/win_bison.exe" \
                -D USE_CCACHE=ON \
                -D WITH_QTWEBENGINE=OFF \
                -D VCPKG_INSTALL_OPTIONS="--x-buildtrees-root=C:/src" \
                -D "NUGET_USERNAME=${GITHUB_ACTOR}" \
                -D "NUGET_SOURCE=https://nuget.pkg.github.com/opengisch/index.json" \
                -D NUGET_TOKEN=${{ secrets.GITHUB_TOKEN }}

      - name: 🌋 Build
        env:
          CCACHE_DEBUG: 1
          CCACHE_LOGFILE: ${{ github.workspace }}/ccache.log
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_NOHASHDIR: "true"
        shell: bash
        run: |
          cmake --build "${{ github.workspace }}/build" --config Release --target qgis_core

      - name: 📤 Upload ccache debug
#        if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ccache-debug
          path: ${{ github.workspace }}/ccache.log


#      - uses: m-kuhn/action-tmate@patch-1
#        if: failure()

      - name: 📦 Package
        shell: bash
        run: |
          cmake --build "${{ github.workspace }}/build" --target bundle --config Release

      - name: 📦 Create SDK
#        if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
        run: |
          vcpkg.exe export --zip --output-dir=./sdk --x-install-root=./build/vcpkg_installed --x-manifest-root=vcpkg

      - name: 📤 Upload sdk
#        if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qgis-sdk-x64-windows
          path: |
            sdk/vcpkg-export-*.zip

      - name: 📑 Upload dep build logs
        id: upload-build-logs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1

        if: failure()
        with:
          name: build-logs-x64-windows
          path: |
            C:/src/**/*.log

      - name: 🧮 Report vcpkg build failures
        if: failure() && github.event_name == 'pull_request'
        uses: ./.github/actions/vcpkg_build_failures_report
        with:
          buildtrees-dir: C:/src
          triplet: x64-windows
          pr: ${{ github.event.number }}
          artifact-url: ${{ steps.upload-build-logs.outputs.artifact-url }}
          build-status: ${{ job.status }}
          manifest-install-log: ${{ github.workspace }}/build/vcpkg-manifest-install.log
          commit-sha: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: 📤 Upload bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1

        id: artifact-win64-qt6
        with:
          name: qgis-windows-qt6
          archive: false
          path: |
            build/*-win64.zip


      - name: Schedule download comment
        uses: ./.github/actions/post_sticky_comment
        if: github.event_name == 'pull_request'
        with:
          marker: mingw64-qt6
          body: |
            ### 🪟 Windows Qt6 builds
            Download [Windows Qt6 builds of this PR for testing](${{ steps.artifact-win64-qt6.outputs.artifact-url }}).
            To execute locally, unzip the downloaded zip file and run `bin\qgis-bin.exe` in the extracted directory.
            You might be prompted by Windows Defender click "Run anyway"
            *(Built from commit ${{ github.event.pull_request.head.sha }})*
          pr: ${{ github.event.number }}
